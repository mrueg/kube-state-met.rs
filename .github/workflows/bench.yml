name: bench
# Benchmarks against the Go original (kube-state-metrics at the ported
# commit). Separate from ci.yml: they take long and their numbers are noisy on
# shared runners, so they report and never fail on a slowdown. Compare Go and
# Rust within one run, not across runs. They run on main, on demand, and on
# pull requests labelled "bench" (the kind+kwok job takes about an hour).
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bench:
    # End-to-end benchmark against the Go original (bench/run.sh): sync time,
    # scrape latency p50/p90/p99 (plain and gzip), throughput with 4 clients,
    # CPU per scrape, RSS, and CPU under 1000 pod events/s; then the criterion
    # micro-benchmarks.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'bench')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: kubernetes/kube-state-metrics
          ref: 46cd52ff39af128e15e64ffd8ba8c75eb6f5a213 # the ported commit
          path: kube-state-metrics-go
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v7
        with:
          go-version-file: kube-state-metrics-go/go.mod
          cache-dependency-path: kube-state-metrics-go/go.sum
      - run: bench/run.sh --scales 1000,10000 --scrapes 30
        env:
          KSM_GO_SRC: kube-state-metrics-go
      - run: cat bench/RESULTS.md >> "$GITHUB_STEP_SUMMARY"
        if: always()
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-results
          path: |
            bench/RESULTS.md
            target/criterion-summary.txt
  bench-kind-kwok:
    # The same comparison against a real, highly available API server: a kind
    # cluster with 3 control-plane nodes and kwok simulating 100 nodes with
    # 10 000 pods (tools/kind-kwok-bench/run.sh). Includes the API server's
    # list time, and the Go client lists in protobuf.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'bench')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: kubernetes/kube-state-metrics
          ref: 46cd52ff39af128e15e64ffd8ba8c75eb6f5a213 # the ported commit
          path: kube-state-metrics-go
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v7
        with:
          go-version-file: kube-state-metrics-go/go.mod
          cache-dependency-path: kube-state-metrics-go/go.sum
      # Four kind nodes exhaust the runner's default inotify limits, and the
      # last kubelet fails to start (kind's known issue "too many open files").
      - run: sudo sysctl -w fs.inotify.max_user_watches=524288 fs.inotify.max_user_instances=512
      - run: tools/kind-kwok-bench/run.sh --pods 10000 --scrapes 30
        env:
          KSM_GO_SRC: kube-state-metrics-go
          KIND_LOGS: kind-logs
      - run: if [ -f bench/RESULTS-kind-kwok.md ]; then cat bench/RESULTS-kind-kwok.md >> "$GITHUB_STEP_SUMMARY"; fi
        if: always()
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-kind-kwok-results
          path: bench/RESULTS-kind-kwok.md
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: kind-logs
          path: kind-logs
          if-no-files-found: ignore
