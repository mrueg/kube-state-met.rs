# CustomResourceDefinitions for the custom resource state metrics app cases.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: foos.myteam.io
spec:
  group: myteam.io
  names:
    plural: foos
    singular: foo
    kind: Foo
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
    - name: v1beta1
      served: false
      storage: false
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: applications.example.com
spec:
  group: example.com
  names:
    plural: applications
    singular: application
    kind: Application
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: false
    - name: v1
      served: true
      storage: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.example.com
spec:
  group: example.com
  names:
    plural: widgetz
    singular: widget
    kind: Widget
  scope: Cluster
  versions:
    - name: v1
      served: true
      storage: true
