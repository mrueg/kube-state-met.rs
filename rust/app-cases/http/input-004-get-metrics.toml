[request]
method = "GET"
path = "/metrics"

[request.headers]
Accept = "application/vnd.google.protobuf;proto=io.prometheus.client.MetricFamily;encoding=delimited;q=0.7,text/plain;version=0.0.4;q=0.3,*/*;q=0.1"

[response]
status = 200

[response.headers]
content-type = "text/plain; version=0.0.4; charset=utf-8"
