[package]
name = "ksm-stores"
description = "Metric families of every Kubernetes resource kube-state-metrics exposes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
ksm-core.workspace = true
k8s-openapi.workspace = true
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
num-bigint = "0.5"
num-integer = "0.1"
num-traits = "0.2"
# Time zones for CronJob schedules (Go embeds time/tzdata the same way).
jiff = { version = "1.0.3", features = ["tzdb-bundle-always"] }


[dev-dependencies]
criterion = "0.8"
serde_json.workspace = true

[lints]
workspace = true

[[bench]]
name = "generate"
harness = false
