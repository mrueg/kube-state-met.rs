[package]
name = "kube-state-metrics"
description = "kube-state-metrics in Rust: generates Prometheus metrics about the state of Kubernetes objects"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "kube-state-metrics"
path = "src/main.rs"

[dependencies]
ksm-core.workspace = true
ksm-stores.workspace = true
ksm-crs.workspace = true
k8s-openapi.workspace = true
kube.workspace = true
tokio.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
parking_lot.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
flate2 = "1"
tokio-util = "0.7"
bytes = "1"
http = "1"
http-body = "1"
rayon = "1"
md5 = { package = "md-5", version = "0.10" }
x509-parser = "0.18.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2"
bcrypt = "0.19"
hyper = { version = "1", features = ["server", "http1", "http2"] }
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "server-graceful", "service", "tokio"] }
base64 = "0.22"
rustls-native-certs = "0.8"
sha2 = "0.10"
notify = "9"

[dev-dependencies]
fake-apiserver = { path = "../../tools/fake-apiserver" }
rcgen = "0.14.10"
serde_json.workspace = true

[lints]
workspace = true
